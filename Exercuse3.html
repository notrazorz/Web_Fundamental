<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      .container{
        display:flex;
        flex-direction: column;
        height:100vh;
        margin: 1rem;
        gap:1.5rem;
      }
      header , footer{
        background-color: #1e90ff ;
        width: 100%;
        height: 200px;
      }
      footer{
        background-color: #4169e1;
      }
      main{
        flex-grow:1;
        display: flex;
        justify-content: space-between;
      }
      .left-side{
        background-color: #3cb371;
        flex-grow:1;
      }
      .right-side{
        background-color: #ff6347;
        width: 300px;
      }
      .all-items{
        display:flex;
        flex-wrap:wrap;tel
        gap:0.5em;
      }
      .item{
        background-color: #2f8d59;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
